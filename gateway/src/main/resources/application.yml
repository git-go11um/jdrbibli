server:
  port: 8084

spring:
  application:
    name: gateway

  webflux:
    cors:
      allowed-origins: "http://localhost:4200"
      allowed-methods: "*"
      allowed-headers: "*"
      exposed-headers: "Authorization"
      allow-credentials: true

  cloud:
    gateway:
      default-filters:
        # Filtre global pour gérer le CORS
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      routes:
        # -------------------------
        # Auth Service
        # -------------------------
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        # -------------------------
        # User Service
        # -------------------------
        - id: user-service
          uri: http://user-service:8082
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=2

        # -------------------------
        # Friends (User) Service
        # -------------------------
        - id: user-service-friends
          uri: http://user-service:8082
          predicates:
            - Path=/api/friends/**
          filters:
            - StripPrefix=2

        # -------------------------
        # Ouvrage Service
        # -------------------------
        - id: ouvrage-service
          uri: http://ouvrage-service:8083
          predicates:
            - Path=/api/ouvrage/**
          filters:
            - RewritePath=/api/ouvrage/(?<remaining>.*)=/${remaining}

        # -------------------------
        # Actuator (Gateway itself)
        # -------------------------
        - id: actuator
          uri: http://gateway:8084
          predicates:
            - Path=/actuator/**

jwt:
  secret: Z2dKbnRHY0NvcnNDWUR0bFhHZ3R3NzIzbVRZT3o0Sk5GZjBWT2tVdzBrckxKVXphMnJKZThCb21BZzk1OU9sWkQ=

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.springframework: DEBUG
    org.springframework.cloud.gateway: DEBUG

