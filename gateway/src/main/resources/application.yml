server:
  port: 8084

spring:
  application:
    name: gateway
  webflux:
    cors:
      allowed-origins: "http://localhost:4200"
      allowed-methods: "*"
      allowed-headers: "*"
      allow-credentials: true


  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/** # capture tout ce qui commence par /api/auth/
          filters:
            - StripPrefix=1 # enlève le "api", il reste /auth/** côté service

        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/user/** # capture /user/** côté service
          filters:
            # Si tu veux enlever un préfixe, tu peux ajouter StripPrefix=1

        - id: ouvrage-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/ouvrage/**
          filters:
            - StripPrefix=0 # pas de modification du chemin

logging:
  level:
    org.springframework.cloud.gateway: DEBUG

