server:
  port: 8085

spring:
  application:
    name: audit-service
  data:
    mongodb:
      uri: mongodb://jdrbibli-mongo:27017/auditdb

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
