<div class="ouvrage-ami-page">

    <h2>Ouvrages de la gamme</h2>

    <button (click)="retourLudothequeAmi()">Retour à la ludothèque de l’ami</button>

    <div *ngIf="loading" class="loading">Chargement...</div>

    <div *ngIf="!loading && errorMessage" class="error">{{ errorMessage }}</div>

    <div *ngIf="!loading && !errorMessage && ouvrages.length > 0" class="ouvrages-list">
        <div *ngFor="let ouvrage of ouvrages" class="ouvrage-card">
            <h3>{{ ouvrage.titre || 'Titre non renseigné' }}</h3>
            

            <button (click)="ouvrirDetail(ouvrage.id!)">Voir plus de détails</button>
        </div>
    </div>

    <div *ngIf="!loading && !errorMessage && ouvrages.length === 0" class="no-ouvrages">
        Aucun ouvrage dans cette gamme.
    </div>

</div>
