<div class="page-wrapper">
  <div class="form-container">
    <h2>Modifier mon mot de passe</h2>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="currentPassword">Mot de passe actuel :</label>
        <input type="password" id="currentPassword" name="currentPassword" [(ngModel)]="currentPassword"
          [ngModelOptions]="{standalone: true}" required minlength="8" />
      </div>

      <div class="form-group">
        <label for="newPassword">Nouveau mot de passe :</label>
        <input type="password" id="newPassword" name="newPassword" [(ngModel)]="newPassword"
          [ngModelOptions]="{standalone: true}" required minlength="8" />
      </div>

      <div class="form-group">
        <label for="confirmNewPassword">Confirmer le mot de passe :</label>
        <input type="password" id="confirmNewPassword" name="confirmNewPassword" [(ngModel)]="confirmNewPassword"
          [ngModelOptions]="{standalone: true}" required minlength="8" />
      </div>

      <button type="submit" [disabled]="newPassword !== confirmNewPassword" class="btn-green">
        Modifier
      </button>
    </form>

    <div *ngIf="errorMessage" class="error">
      {{ errorMessage }}
    </div>
  </div>
</div>
