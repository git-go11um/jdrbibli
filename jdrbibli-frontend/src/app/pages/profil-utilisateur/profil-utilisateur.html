<div class="profil-utilisateur">
    <div class="left-column">
        <h1>Profil utilisateur</h1>

        <div class="user-info">
            <div class="info-item">
                <label>Pseudo:</label>
                <span>{{ pseudo }}</span>
            </div>
            <div class="info-item">
                <label>Email:</label>
                <span>{{ email }}</span>
            </div>
            <div class="info-item">
                <label>Mot de passe:</label>
                <span>{{ motDePasse }}</span>
            </div>
            <div class="info-item">
                <label>Avatar:</label>
                <div class="avatar-section">
                    <img *ngIf="avatarUrl" [src]="avatarUrl" alt="Avatar utilisateur" width="100" height="100">
                    <p *ngIf="!avatarUrl">Aucun avatar uploadé</p>

                    <!-- Input fichier et bouton upload -->
                    <input type="file" (change)="onFileSelected($event)" accept="image/*">
                    <button (click)="uploadAvatar()" [disabled]="!selectedFile">Envoyer l’avatar</button>
                </div>

            </div>
        </div>

        <div class="action-buttons">
            <button class="btn-modifier" routerLink="/profile-edit">Modifier le compte</button>
            <button (click)="goToResetPassword()">Modifier mon mot de passe</button> <button class="btn-supprimer"
                (click)="deleteUser()">Supprimer le compte</button>
        </div>
    </div>

    <div class="right-column">
        <h2>Amis</h2>
        <p>Aucune information sur les amis pour l'instant.</p>
    </div>
</div>
