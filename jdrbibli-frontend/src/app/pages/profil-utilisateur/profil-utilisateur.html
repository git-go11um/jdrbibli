<div class="profil-utilisateur">
    <div class="left-column">
        <h1>Profil utilisateur</h1>

        <div class="user-info">
            <!-- Pseudo -->
            <div class="info-item">
                <label>Pseudo:</label>
                <span>{{ pseudo }}</span>
            </div>

            <!-- Email -->
            <div class="info-item">
                <label>Email:</label>
                <span>{{ email }}</span>
            </div>

            <!-- Avatar -->
            <div class="info-item">
                <label>Avatar:</label>
                <div class="avatar-section">
    <div class="avatar-container">
        <img *ngIf="avatarUrl; else noAvatar" [src]="avatarUrl" alt="Avatar utilisateur" class="avatar-circle">
        <ng-template #noAvatar>
            <div class="avatar-circle"></div>
        </ng-template>
    </div>
    
    <div class="avatar-actions-inline">
        <input type="file" (change)="onFileSelected($event)" accept="image/*">
        <button (click)="uploadAvatar()" [disabled]="!selectedFile">Envoyer l’avatar</button>
    </div>
</div>



                    <!-- Input fichier et bouton upload -->
                    
                </div>
            </div>
        

        <!-- Boutons actions -->
        <div class="action-buttons">
            <button class="btn-modifier" routerLink="/profile-edit">Modifier le compte</button>
            <button (click)="goToResetPassword()">Modifier mon mot de passe</button>
            <button class="btn-supprimer" (click)="deleteUser()">Supprimer le compte</button>
        </div>
    </div>

    <!-- Colonne droite pour les amis -->
    <div class="right-column">
        <h2>Amis</h2>
        <p>Aucune information sur les amis pour l'instant.</p>
    </div>
</div>
