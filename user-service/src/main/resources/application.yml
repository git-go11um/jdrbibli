server:
  port: 8082

spring:
  datasource:
    url: jdbc:mariadb://jdrbibli-db:3306/user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

  flyway:
    enabled: false
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Chemin où seront stockés les avatars
user:
  avatar:
    upload-dir: uploads/avatars

ouvrage:
  service:
    url: http://localhost:8083/api/ouvrage

# JWT secret (doit être exactement le même que dans auth-service)
jwt:
  secret: Z2dKbnRHY0NvcnNDWUR0bFhHZ3R3NzIzbVRZT3o0Sk5GZjBWT2tVdzBrckxKVXphMnJKZThCb21BZzk1OU9sWkQ=
  expiration: 3600000 # 1 heure en millisecondes

